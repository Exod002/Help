{% extends 'reports/base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Generated Report</h5>
                    <a href="{% url 'download_report' %}" class="btn btn-primary">
                        Download PDF
                    </a>
                </div>
                <div class="card-body">
                    <h2 class="mb-4">{{ report.title }}</h2>
                    <p class="text-muted mb-4">Generated on: {{ report.date }}</p>
                    <div class="report-content">
                        {{ report.content|linebreaks }}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
