{% extends 'reports/base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-8 offset-md-2 text-center">
            <h1 class="display-4 mb-4">Welcome, {{ user.username }}!</h1>
            <p class="lead mb-4">Thank you for logging in to our dashboard system.</p>
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Power BI Report</h5>
                    <p class="card-text">Click the button below to view the Power BI report and take a screenshot for analysis.</p>
                    <a href="{% url 'powerbi_report' %}" class="btn btn-primary btn-lg">
                        View Power BI Report
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
